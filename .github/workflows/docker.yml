            type=raw,value=ubuntu-${{ needs.resolve_versions.outputs.ubuntu_version }}-slurm-${{ env.SLURM_VERSION }}
          flavor: |
            latest=true
            prefix=
            suffix=
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to GHCR
        uses: docker/login-action@v3
        with:
