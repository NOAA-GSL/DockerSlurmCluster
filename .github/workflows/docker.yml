name: Docker Slurm

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SLURM_VERSION: 25.11.5
  REGISTRY: ghcr.io/noaa-gsl/dockerslurmcluster

jobs:

  docker_compose_test_amd64:
    name: Compose Test (ubuntu-${{ matrix.ubuntu }}, amd64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    steps:
      -
        name: Checkout Repository
        uses: actions/checkout@v4
      -
        name: Build and start containers
        run: UBUNTU_BASE=ubuntu:${{ matrix.ubuntu }} docker compose -f docker-compose.yml up --build --pull never -d
      -
        name: Check cluster logs
        run: docker compose -f docker-compose.yml logs
      -
        name: Check status of the cluster containers
        run: docker compose -f docker-compose.yml ps
      -
        name: Check status of Slurm
        run: docker exec slurm-frontend sinfo
      -
        name: Run a Slurm job
        run: docker exec slurm-frontend srun hostname
      -
        name: Test ssh access to Slurm compute nodes
        run: |
          docker exec slurm-frontend timeout 1s ssh slurmnode1 hostname
          docker exec slurm-frontend timeout 1s ssh slurmnode2 hostname
          docker exec slurm-frontend timeout 1s ssh slurmnode3 hostname
      -
        name: Shut down Slurm cluster containers
        run: docker compose -f docker-compose.yml down

  docker_compose_test_arm64:
    name: Compose Test (ubuntu-${{ matrix.ubuntu }}, arm64)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    steps:
      -
        name: Install Docker (official apt method)
        run: |
          set -euxo pipefail
          # Remove any conflicting packages
          for pkg in docker.io containerd runc; do sudo apt-get remove -y $pkg || true; done
          # Add Docker's official GPG key
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg lsb-release apt-transport-https
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          # Add Docker apt repo
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
            sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update -y
          # Install Docker, Buildx, Compose
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          # Allow runner user to access docker
          sudo usermod -aG docker $USER
          sudo apt-get install -y acl
          sudo setfacl --modify user:$USER:rw /var/run/docker.sock || true
          # Start Docker daemon if not running
          if ! pgrep dockerd > /dev/null; then
            (sudo dockerd > /tmp/dockerd.log 2>&1 &)
            sleep 5
          fi
          docker version
          docker info
          docker compose version
      -
        name: Checkout Repository
        uses: actions/checkout@v4
      -
        name: Build and start containers
        run: UBUNTU_BASE=ubuntu:${{ matrix.ubuntu }} docker compose -f docker-compose.yml up --build --pull never -d
      -
        name: Check cluster logs
        run: docker compose -f docker-compose.yml logs
      -
        name: Check status of the cluster containers
        run: docker compose -f docker-compose.yml ps
      -
        name: Check status of Slurm
        run: docker exec slurm-frontend sinfo
      -
        name: Run a Slurm job
        run: docker exec slurm-frontend srun hostname
      -
        name: Test ssh access to Slurm compute nodes
        run: |
          docker exec slurm-frontend timeout 1s ssh slurmnode1 hostname
          docker exec slurm-frontend timeout 1s ssh slurmnode2 hostname
          docker exec slurm-frontend timeout 1s ssh slurmnode3 hostname
      -
        name: Shut down Slurm cluster containers
        run: docker compose -f docker-compose.yml down

  build:
    name: Build ${{ matrix.container }} (ubuntu-${{ matrix.ubuntu }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [docker_compose_test_amd64, docker_compose_test_arm64]
    timeout-minutes: 360
    permissions:
      packages: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        container: [frontend, master, node]
        ubuntu: ['24.04', '26.04']
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
        arch: [amd64, arm64]
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v4
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/slurm-${{ matrix.container }}
          tags: |
            type=raw,value=ubuntu-${{ matrix.ubuntu }}-slurm-${{ env.SLURM_VERSION }}
          flavor: |
            latest=false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      -
        name: Prune pre-loaded GHA docker images
        run: |
          docker images
          docker image prune -a -f
          docker images
      -
        name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.container }}
          file: ./${{ matrix.container }}/Dockerfile
          build-args: UBUNTU_BASE=ubuntu:${{ matrix.ubuntu }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.container }}-cache-${{ matrix.ubuntu }}-${{ matrix.arch }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.container }}-cache-${{ matrix.ubuntu }}-${{ matrix.arch }}:cache,mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/slurm-${{ matrix.container }},push-by-digest=true,name-canonical=true,push=true
      -
        name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      -
        name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.container }}-${{ matrix.ubuntu }}-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.container }} (ubuntu-${{ matrix.ubuntu }})
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        container: [frontend, master, node]
        ubuntu: ['24.04', '26.04']
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v4
      -
        name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: ${{ matrix.container }}-${{ matrix.ubuntu }}-digests-*
          merge-multiple: true
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/slurm-${{ matrix.container }}
          tags: |
            type=raw,value=ubuntu-${{ matrix.ubuntu }}-slurm-${{ env.SLURM_VERSION }}
          flavor: |
            latest=false
      -
        name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      -
        name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/slurm-${{ matrix.container }}@sha256:%s ' *)
      -
        name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/slurm-${{ matrix.container }}:${{ steps.meta.outputs.version }}

  scan-images:
    name: Scan ${{ matrix.container }} (ubuntu-${{ matrix.ubuntu }})
    runs-on: ubuntu-latest
    needs: merge
    permissions:
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        container: [frontend, master, node]
        ubuntu: ['24.04', '26.04']
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v4
      -
        name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/slurm-${{ matrix.container }}:ubuntu-${{ matrix.ubuntu }}-slurm-${{ env.SLURM_VERSION }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'
