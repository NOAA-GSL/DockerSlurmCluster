  scan-images:
    name: Scan images for fixable High/Critical CVEs
    runs-on: ubuntu-latest
    needs:
      - merge-frontend
      - merge-master
      - merge-node
    permissions:
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/noaa-gsl/dockerslurmcluster/slurm-frontend:latest
          - ghcr.io/noaa-gsl/dockerslurmcluster/slurm-master:latest
          - ghcr.io/noaa-gsl/dockerslurmcluster/slurm-node:latest
