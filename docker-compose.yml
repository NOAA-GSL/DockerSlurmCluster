x-node-common: &node-common
  image: ghcr.io/noaa-gsl/dockerslurmcluster/slurm-node:${IMAGE_TAG}
  shm_size: '4g'
  user: admin
  volumes:
    - shared-vol:/home/admin:nocopy
  environment:
    SLURM_CPUS_ON_NODE: ${SLURM_CPUS_ON_NODE}
  depends_on:
    - slurmmaster

services:
  slurmfrontend:
    build:
      context: ./frontend
      args:
        UBUNTU_BASE: ${UBUNTU_BASE}
    image: ghcr.io/noaa-gsl/dockerslurmcluster/slurm-frontend:${IMAGE_TAG}
    container_name: slurm-frontend
    shm_size: '4g'
    hostname: slurmfrontend
    user: admin
    volumes:
      - shared-vol:/home/admin
    ports:
      - 8888:8888
  slurmmaster:
    build:
      context: ./master
      args:
        UBUNTU_BASE: ${UBUNTU_BASE}
    image: ghcr.io/noaa-gsl/dockerslurmcluster/slurm-master:${IMAGE_TAG}
    container_name: slurm-master
    shm_size: '4g'
    hostname: slurmmaster
    user: admin
    volumes:
      - shared-vol:/home/admin:nocopy
    environment:
      SLURM_CPUS_ON_NODE: ${SLURM_CPUS_ON_NODE}
    ports:
      - 6817:6817
      - 6818:6818
      - 6819:6819
  slurmnode1:
    <<: *node-common
    build:
      context: ./node
      args:
        UBUNTU_BASE: ${UBUNTU_BASE}
    container_name: slurm-node1
    hostname: slurmnode1
    environment:
      SLURM_NODENAME: slurmnode1
      SLURM_CPUS_ON_NODE: ${SLURM_CPUS_ON_NODE}
  slurmnode2:
    <<: *node-common
    container_name: slurm-node2
    hostname: slurmnode2
    environment:
      SLURM_NODENAME: slurmnode2
      SLURM_CPUS_ON_NODE: ${SLURM_CPUS_ON_NODE}
  slurmnode3:
    <<: *node-common
    container_name: slurm-node3
    hostname: slurmnode3
    environment:
      SLURM_NODENAME: slurmnode3
      SLURM_CPUS_ON_NODE: ${SLURM_CPUS_ON_NODE}
volumes:
  shared-vol:
